[package]
name = "trash"
version = "0.1.0"
edition.workspace = true
license = "MIT"

[lib]
doctest = false
path = "src/trash.rs"

[dependencies]
log.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target."cfg(target_os = \"linux\")".dependencies]
