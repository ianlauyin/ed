[package]
name = "cli"
version = "0.1.0"
edition.workspace = true

[lints]
workspace = true

[lib]
path = "src/cli.rs"
doctest = false

[[bin]]
name = "cli"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = [
    "dep:clap",
    "dep:clap_complete",
    "dep:console",
    "dep:core-foundation",
    "dep:core-services",
    "dep:dialoguer",
    "dep:parking_lot",
    "dep:paths",
    "dep:plist",
    "dep:rayon",
    "dep:tempfile",
    "dep:util",
    "dep:walkdir",
]

[dependencies]
anyhow.workspace = true
clap = { workspace = true, optional = true }
clap_complete = { workspace = true, optional = true }
collections.workspace = true
console = { workspace = true, optional = true }
dialoguer = { workspace = true, optional = true }
ipc-channel = "0.19"
parking_lot = { workspace = true, optional = true }
paths = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
util = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true, optional = true }
core-services = { workspace = true, optional = true }
plist = { workspace = true, optional = true }
