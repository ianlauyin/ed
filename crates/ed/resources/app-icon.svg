<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6A7488"/>
      <stop offset="0.45" stop-color="#4C566A"/>
      <stop offset="1" stop-color="#2E3440"/>
    </linearGradient>
    <linearGradient id="bezelEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ECEFF4" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ECEFF4" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ECEFF4" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4252"/>
      <stop offset="1" stop-color="#242933"/>
    </linearGradient>
    <radialGradient id="glowBg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#88C0D0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#88C0D0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ECEFF4" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ECEFF4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- bezel -->
  <rect x="88" y="100" width="848" height="848" rx="197" fill="#000" fill-opacity="0.05"/>
