  <rect x="178" y="180" width="668" height="666" rx="124" fill="url(#screen)"/>
  <rect x="178" y="180" width="668" height="666" rx="124" fill="url(#glowBg)"/>
  <path d="M302 180 H722 A124 124 0 0 1 846 304 V420 Q512 470 178 420 V304 A124 124 0 0 1 302 180 Z" fill="url(#shine)"/>

