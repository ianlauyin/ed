[package]
name = "gpui_apple"
version = "0.1.0"
edition.workspace = true


[lints]
workspace = true

[lib]
path = "src/gpui_apple.rs"
doctest = false

[features]
default = ["runtime_shaders"]
runtime_shaders = []

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
gpui.workspace = true
anyhow.workspace = true
async-task.workspace = true
block2.workspace = true
collections.workspace = true
core-foundation.workspace = true
core-foundation-sys.workspace = true
core-graphics.workspace = true
core-text.workspace = true
derive_more.workspace = true
dispatch2.workspace = true
etagere.workspace = true
futures.workspace = true
log.workspace = true
objc2.workspace = true
objc2-core-foundation = { workspace = true, features = ["std", "CFCGTypes", "CFData", "CFDictionary", "CFString", "CFNumber", "CFBase"] }
objc2-core-graphics.workspace = true
objc2-core-text.workspace = true
objc2-metal = { workspace = true, features = [
    "std",
    "block2",
    "dispatch2",
    "MTLAllocation",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLDrawable",
    "MTLLibrary",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLRenderPipeline",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSError", "NSRange", "NSString", "NSThread", "NSNotification", "NSOperation", "NSProcessInfo", "block2"] }
objc2-quartz-core = { workspace = true, features = ["objc2-core-foundation", "objc2-core-graphics", "objc2-metal"] }
objc2-security.workspace = true
parking_lot.workspace = true
smallvec.workspace = true
thiserror.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.build-dependencies]
cbindgen.workspace = true
