name = "Env"
auto_indent_using_last_non_empty_line = true
grammar = "bash"
path_suffixes = [".env"]
line_comments = ["# "]
autoclose_before = "}"
brackets = [
    { start = "{", end = "}", close = true, newline = false, surround = true },
    { start = "\"", end = "\"", close = true, newline = false, surround = true, not_in = ["comment", "string"] },
    { start = "'", end = "'", close = true, newline = false, surround = true, not_in = ["string", "comment"] },
]
