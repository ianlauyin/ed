name = "Rust"
auto_indent_using_last_non_empty_line = true
grammar = "rust"
path_suffixes = ["rs"]
modeline_aliases = ["rs", "rustic"]
line_comments = ["// ", "/// ", "//! "]
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true, surround = true },
    { start = "r#\"", end = "\"#", close = true, newline = true, surround = true, not_in = ["string", "comment"] },
    { start = "r##\"", end = "\"##", close = true, newline = true, surround = true, not_in = ["string", "comment"] },
    { start = "r###\"", end = "\"###", close = true, newline = true, surround = true, not_in = ["string", "comment"] },
    { start = "[", end = "]", close = true, newline = true, surround = true },
    { start = "(", end = ")", close = true, newline = true, surround = true },
    { start = "<", end = ">", close = false, newline = true, surround = true, not_in = ["string", "comment"] },
    { start = "\"", end = "\"", close = true, newline = false, surround = true, not_in = ["string"] },
    { start = "`", end = "`", close = false, newline = false, surround = true, not_in = ["string"] },
    { start = "/*", end = " */", close = true, newline = false, surround = true, not_in = ["string", "comment"] },
]
collapsed_placeholder = " /* ... */ "
block_comment = { start = "/*", prefix = "* ", end = "*/", tab_size = 1 }
documentation_comment = { start = "/*", prefix = "* ", end = "*/", tab_size = 1 }
