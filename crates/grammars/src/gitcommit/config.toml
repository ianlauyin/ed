name = "Git Commit"
auto_indent_using_last_non_empty_line = true
path_suffixes = [
  "TAG_EDITMSG",
  "MERGE_MSG",
  "COMMIT_EDITMSG",
  "NOTES_EDITMSG",
  "EDIT_DESCRIPTION",
]
line_comments = ["# "]
brackets = [
  { start = "(", end = ")", close = true, newline = false, surround = true },
  { start = "`", end = "`", close = true, newline = false, surround = true },
  { start = "\"", end = "\"", close = true, newline = false, surround = true },
  { start = "'", end = "'", close = true, newline = false, surround = true },
  { start = "{", end = "}", close = true, newline = false, surround = true },
  { start = "[", end = "]", close = true, newline = false, surround = true },
]
rewrap_prefixes = [
    "[-*+]\\s+",
    "\\d+\\.\\s+",
    ">\\s*",
    "[-*+]\\s+\\[[\\sx]\\]\\s+"
]
