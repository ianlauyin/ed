syntax = "proto3";
package ed.messages;

message ShutdownRemoteServer {}

message Toast {
  uint64 project_id = 1;
  string notification_id = 2;
  string message = 3;
}

message HideToast {
  uint64 project_id = 1;
  string notification_id = 2;
}

message OpenServerSettings {
  uint64 project_id = 1;
}

