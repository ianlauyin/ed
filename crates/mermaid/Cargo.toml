# Started as a copy of https://github.com/wevm/ondine (crates/compiler, commit
# 0b589ec), a Rust port of Obsidian's Pele (https://github.com/obsidianmd/pele).
# It is owned and edited here; Ondine and Pele are references, not upstreams to
# merge from. Ondine's parity tests (and their fixtures) were not kept.
[package]
name = "mermaid"
description = "Pure Mermaid-to-SVG compiler: preprocessing, parsing, layout, and SVG emission."
version = "0.0.0"
edition.workspace = true
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"
doctest = false

# Upstream's lints, so its `#[expect(...)]` attributes stay fulfilled.
[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
# Newer clippy no longer fires some lints upstream expects.
unfulfilled_lint_expectations = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
dbg_macro = "warn"
get_unwrap = "warn"
iter_over_hash_type = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
print_stderr = "warn"
print_stdout = "warn"
similar_names = "allow"
todo = "warn"
too_many_lines = "allow"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
# Lints newer than upstream's pinned toolchain (1.97); `src/` stays as upstream wrote it.
chunks_exact_to_as_chunks = "allow"
needless_late_init = "allow"
