[package]
name = "gpui_platform"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_platform.rs"
doctest = false

[features]
default = []
font-kit = ["gpui_macos/font-kit"]
inspector = ["gpui/inspector"]
screen-capture = ["gpui/screen-capture", "gpui_macos/screen-capture"]
runtime_shaders = ["gpui_macos/runtime_shaders"]

[dependencies]
anyhow.workspace = true
gpui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
flume.workspace = true
futures.workspace = true
smol.workspace = true
