[package]
description = "A focused single-user code editor."
edition.workspace = true
name = "zed"
version = "1.26.0"
publish.workspace = true
authors = ["Zed Team <hi@zed.dev>"]
default-run = "zed"

[lints]
workspace = true

[[bin]]
name = "zed"
path = "src/main.rs"

[dependencies]
