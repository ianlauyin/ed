[package]
name = "util"
version = "0.1.0"
edition.workspace = true
description = "A collection of utility structs and functions used by Zed and GPUI"

[lints]
workspace = true

[lib]
path = "src/util.rs"
doctest = true

[dependencies]
anyhow.workspace = true
collections.workspace = true
globset.workspace = true
itertools.workspace = true
regex = { workspace = true, features = ["unicode-bool", "unicode-gencat"] }
rust-embed.workspace = true
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_json_lenient.workspace = true
unicase.workspace = true
url.workspace = true
percent-encoding.workspace = true
gpui_util.workspace = true
path = { workspace = true, features = ["serde"] }

futures-lite.workspace = true
shlex.workspace = true
smol.workspace = true
async-fs.workspace = true
dirs.workspace = true

log.workspace = true

[target.'cfg(unix)'.dependencies]
command-fds = "0.3.1"
libc.workspace = true
nix = { workspace = true, features = ["resource", "user"] }

[target.'cfg(target_os = "macos")'.dependencies]
mach2.workspace = true
which.workspace = true
