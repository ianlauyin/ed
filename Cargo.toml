[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/ed"]

[workspace.package]
version = "2.0.8"
edition = "2024"

[workspace.dependencies]
activity_indicator = { path = "crates/activity_indicator" }
assets = { path = "crates/assets" }
async_macos = { path = "crates/async_macos" }
buffer_diff = { path = "crates/buffer_diff" }
clock = { path = "crates/clock" }
command_palette = { path = "crates/command_palette" }
control = { path = "crates/control" }
derive_refineable = { path = "crates/refineable/derive_refineable" }
diagnostics = { path = "crates/diagnostics" }
ed_actions = { path = "crates/ed_actions" }
editor = { path = "crates/editor" }
encoding_selector = { path = "crates/encoding_selector" }
file_content = { path = "crates/file_content" }
file_finder = { path = "crates/file_finder" }
file_icons = { path = "crates/file_icons" }
fs = { path = "crates/fs" }
fuzzy = { path = "crates/fuzzy" }
git = { path = "crates/git" }
git_ui = { path = "crates/git_ui" }
git_ui_core = { path = "crates/git_ui_core" }
go_to_line = { path = "crates/go_to_line" }
gpui = { path = "crates/gpui", default-features = false }
gpui_apple = { path = "crates/gpui_apple" }
gpui_macos = { path = "crates/gpui_macos", default-features = false }
gpui_macros = { path = "crates/gpui_macros" }
gpui_shared_string = { path = "crates/gpui_shared_string" }
gpui_util = { path = "crates/gpui_util" }
icons = { path = "crates/icons" }
image_viewer = { path = "crates/image_viewer" }
language = { path = "crates/language" }
language_core = { path = "crates/language_core" }
language_selector = { path = "crates/language_selector" }
language_tools = { path = "crates/language_tools" }
languages = { path = "crates/languages" }
lsp = { path = "crates/lsp" }
lsp_command_selector = { path = "crates/lsp_command_selector" }
lsp_locations = { path = "crates/lsp_locations" }
lsp_types = { path = "crates/lsp_types" }
markdown = { path = "crates/markdown" }
markdown_preview = { path = "crates/markdown_preview" }
menu = { path = "crates/menu" }
mermaid = { path = "crates/mermaid" }
multi_buffer = { path = "crates/multi_buffer" }
notifications = { path = "crates/notifications" }
open_path_prompt = { path = "crates/open_path_prompt" }
path = { path = "crates/path" }
paths = { path = "crates/paths" }
picker = { path = "crates/picker" }
project = { path = "crates/project" }
project_panel = { path = "crates/project_panel" }
project_symbols = { path = "crates/project_symbols" }
recent_projects = { path = "crates/recent_projects" }
refineable = { path = "crates/refineable" }
rope = { path = "crates/rope" }
search = { path = "crates/search" }
snippet = { path = "crates/snippet" }
spell_check = { path = "crates/spell_check" }
sum_tree = { path = "crates/sum_tree" }
svg_preview = { path = "crates/svg_preview" }
tab_switcher = { path = "crates/tab_switcher" }
task = { path = "crates/task" }
terminal = { path = "crates/terminal" }
terminal_view = { path = "crates/terminal_view" }
text = { path = "crates/text" }
theme = { path = "crates/theme" }
time_format = { path = "crates/time_format" }
title_bar = { path = "crates/title_bar" }
trash = { path = "crates/trash" }
ui = { path = "crates/ui" }
ui_input = { path = "crates/ui_input" }
util = { path = "crates/util" }
watch = { path = "crates/watch" }
workspace = { path = "crates/workspace" }
worktree = { path = "crates/worktree" }

# External crates
aho-corasick = "1.1"
anyhow = "1"
async-channel = { version = "2.5", default-features = false }
async-lock = { version = "3.4", default-features = false }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "3aea7f5029bf9c2694842398351d770d87032ddf" }
async-trait = "0.1"
base64 = "0.23"
bitflags = "2.6.0"
block2 = "0.6"
clap = { version = "4.4", features = ["derive", "wrap_help"] }
derive_more = { version = "2.1", features = ["deref", "deref_mut", "from_str"] }
dirs = "7.0"
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
encoding_rs = "0.8"
etagere = "0.3"
futures = "0.3.34"
globset = "0.4"
heapless = "0.9.2"
ignore = "0.4.22"
# Only the formats the editor decodes; see `gpui::ImageFormat`.
image = { version = "0.25.1", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
imara-diff = { version = "0.2", default-features = false }
indexmap = { version = "2.7.0", features = ["serde"] }
itertools = "0.15"
libc = "0.2"
linkify = "0.11"
log = { version = "0.4", default-features = false, features = ["std"] }
lru = "0.19"
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGColorSpace", "std"] }
objc2-foundation = {
  version = "0.3.2",
  default-features = false,
  features = [
    "NSArray",
    "NSAttributedString",
    "NSCoder",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSNull",
    "NSObjCRuntime",
    "NSObject",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSSet",
    "NSString",
    "NSURL",
    "NSValue",
    "objc2-core-foundation",
    "std",
  ]
}
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer", "CAMetalDisplayLink", "CAMetalLayer", "std"] }
ordered-float = "5"
parking_lot = "0.13"
percent-encoding = "2.3"
proc-macro2 = "1.0.93"
quote = "1.0.9"
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "sys_rng"] }
raw-window-handle = "0.6"
regex = { version = "1.5", default-features = false, features = ["perf", "std"] }
rust-embed = { version = "8.11", features = ["compression", "include-exclude"] }
rustc-hash = "2"
serde = { version = "1", features = ["rc"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha2 = "0.11"
shellexpand = "3.1"
shlex = "2.0"
slotmap = "1.0.6"
smallvec = { version = "1.6", features = ["const_new", "union"] }
strum = { version = "0.28", features = ["derive"] }
syn = { version = "3.0", default-features = false, features = ["proc-macro"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tempfile = "3.20.0"
thiserror = "2.0.12"
time = {
  version = "0.3",
  features = [
    "formatting",
    "local-offset",
    "macros",
    "parsing",
    "serde",
    "serde-well-known",
  ]
}
tree-sitter = "0.27.1"
unicase = "2.6"
unicode-segmentation = "1.10"
url = "2.2"
usvg = { version = "0.50", default-features = false }
uuid = { version = "1.1", features = ["serde"] }

[workspace.lints.clippy]
# pedantic
assigning_clones = "warn"
borrow_as_ptr = "warn"
