[workspace.lints.clippy]
# nursery
missing_const_for_fn = "warn"
needless_pass_by_ref_mut = "warn"
redundant_clone = "warn"

# pedantic
assigning_clones = "warn"
borrow_as_ptr = "warn"
cast_possible_wrap = "warn"
cast_ptr_alignment = "warn"
checked_conversions = "warn"
cloned_instead_of_copied = "warn"
collapsible_else_if = "warn"
comparison_chain = "warn"
copy_iterator = "warn"
decimal_bitwise_operands = "warn"
default_trait_access = "warn"
duration_suboptimal_units = "warn"
elidable_lifetime_names = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
format_collect = "warn"
format_push_string = "warn"
wildcard_imports = "warn"

# old lint rules

# Motivation: We use `vec![a..b]` a lot when dealing with ranges in text, so
# warning on this rule produces a lot of noise.
single_range_in_vec_init = "allow"

# in Rust it can be very tedious to reduce argument count without
# running afoul of the borrow checker.
too_many_arguments = "allow"

# We often have large enum variants yet we rarely actually bother with splitting them up.
large_enum_variant = "allow"

[workspace.lints.rust]
unused_crate_dependencies = "warn"

[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
notify = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }
notify-types = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }

[profile.dev]
debug = "none"
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16

[profile.dev.package]
derive_refineable = { opt-level = 3 }
# proc-macros start
gpui_macros = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
quote = { opt-level = 3 }
sqlez_macros = { opt-level = 3, codegen-units = 1 }
syn = { opt-level = 3 }
ui_macros = { opt-level = 3 }
# proc-macros end

# Build single-source-file crates with cg=1 as it helps make `cargo build` of a whole workspace a bit faster
activity_indicator = { codegen-units = 1 }
assets = { codegen-units = 1 }
breadcrumbs = { codegen-units = 1 }
collections = { codegen-units = 1 }
command_palette = { codegen-units = 1 }
ed_actions = { codegen-units = 1 }
file_content = { codegen-units = 1 }
file_icons = { codegen-units = 1 }
image_viewer = { codegen-units = 1 }
json_schema_store = { codegen-units = 1 }
menu = { codegen-units = 1 }
notifications = { codegen-units = 1 }
outline = { codegen-units = 1 }
paths = { codegen-units = 1 }
project_symbols = { codegen-units = 1 }
refineable = { codegen-units = 1 }
resvg = { opt-level = 3 }
serde_json = { opt-level = 3 }
session = { codegen-units = 1 }
snippet = { codegen-units = 1 }
taffy = { opt-level = 3 }
theme_selector = { codegen-units = 1 }
time_format = { codegen-units = 1 }
tree-sitter = { opt-level = 3 }
ui_input = { codegen-units = 1 }

[profile.release]
debug = "line-tables-only"
split-debuginfo = "packed"
strip = true
lto = "thin"
codegen-units = 1

[profile.release.package]
ed = { codegen-units = 16 }
